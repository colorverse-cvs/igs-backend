version: '3.9'

services:
  mongodb:
    image: mongo:6.0
    container_name: giftshop-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: giftshop
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - giftshop-network

  mongo-express:
    image: mongo-express:latest
    container_name: giftshop-mongo-express
    restart: always
    depends_on:
      - mongodb
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_SERVER: giftshop-mongodb
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: root
    networks:
      - giftshop-network

  redis:
    image: redis:7.2-alpine
    container_name: giftshop-redis
    restart: always
    ports:
      - '6379:6379'
    networks:
      - giftshop-network

  # Uncomment this when you’re ready to run the backend
  # giftshop-api:
  #   build: .
  #   container_name: giftshop-api
  #   restart: always
  #   depends_on:
  #     - mongodb
  #   environment:
  #     - NODE_ENV=development
  #     - MONGO_URI=mongodb://admin:root@mongodb:27017/giftshop?authSource=admin
  #     - JWT_SECRET=supersecret
  #     - PORT=3000
  #   ports:
  #     - '3000:3000'
  #   command: npm run start:dev
  #   networks:
  #     - giftshop-network
  #   volumes:
  #     - .:/app
  #     - /app/node_modules

volumes:
  mongo_data:

networks:
  giftshop-network:
    driver: bridge
